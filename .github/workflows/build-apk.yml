name: Build APK

# Builds an installable release APK and attaches it as a downloadable
# artifact. The app's release build signs with the debug key
# (android/app/build.gradle.kts), so no keystore secrets are needed.
on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Flutter 3.47 tooling requires JDK 17+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      # Serial is mandatory: the suites share one sqflite database file, so
      # the default parallel run produces spurious failures.
      - name: Run tests
        run: flutter test --concurrency=1

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lockout-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
